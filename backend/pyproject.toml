[project]
name = "opencode-devkit-backend"
version = "0.1.0"
description = "Backend for OpenCode DevKit — audit, analyze, and optimize OpenCode config files"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2,<3",
    "jsonschema>=4,<5",
    "pyyaml>=6,<7",
    "python-multipart>=0.0.19",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "httpx>=0.28,<1",
    "types-jsonschema>=4,<5",
    "types-pyyaml>=6,<7",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
